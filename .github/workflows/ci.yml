# On every push and pull request:
#   1. lint and run the test suite (fake models: no API key, no downloads, no PDFs)
#   2. build the Docker image and smoke-test the running container with the
#      REAL models and the real index (only the LLM is not called)
name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint with ruff
        run: ruff check .

      - name: Run tests
        run: pytest -v

  docker:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Build the image
        run: docker build -t telecomdocqa .

      - name: Start the container
        # A dummy key is enough: the smoke test only uses retrieval, not the LLM.
        run: docker run -d --name app -p 7860:7860 -e LLM_API_KEY=dummy telecomdocqa

      - name: Wait until the API is up
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:7860/health; then echo; exit 0; fi
            sleep 3
          done
          docker logs app
          exit 1

      - name: Smoke test a real search
        run: |
          curl -sf -X POST http://localhost:7860/search \
               -H "Content-Type: application/json" \
               -d '{"question": "What is the role of the AMF?", "top_k": 3}' > result.json
          python3 -c "import json; r = json.load(open('result.json')); print(r[0]['spec'], r[0]['section_number'], r[0]['section_title']); assert len(r) == 3"

      - name: Show container memory use
        if: always()
        run: docker stats --no-stream app || true