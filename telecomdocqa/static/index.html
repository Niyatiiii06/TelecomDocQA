<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TelecomDocQA</title>
<style>
  :root {
    --bg: #fafaf9; --panel: #ffffff; --text: #1c1917; --muted: #6b6560;
    --line: #e7e5e4; --accent: #1d4ed8; --accent-soft: #dbeafe; --warn: #b45309;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #161514; --panel: #1f1e1c; --text: #f5f5f4; --muted: #a8a29e;
      --line: #34322f; --accent: #93b4fd; --accent-soft: #1e2a4a; --warn: #f59e0b;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 16px/1.55 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 820px; margin: 0 auto; padding: 32px 16px 64px; }
  h1 { font-size: 26px; margin: 0 0 4px; letter-spacing: -0.01em; }
  .sub { color: var(--muted); margin: 0 0 24px; font-size: 15px; }
  form { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px; }
  textarea { width: 100%; min-height: 72px; resize: vertical; font: inherit; color: var(--text);
             background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 10px; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; align-items: center; }
  select, input[type=text] { font: inherit; font-size: 14px; color: var(--text); background: var(--bg);
             border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; }
  input[type=text] { width: 150px; }
  button { margin-left: auto; font: inherit; font-weight: 600; color: #fff; background: var(--accent);
           border: 0; border-radius: 8px; padding: 8px 18px; cursor: pointer; }
  @media (prefers-color-scheme: dark) { button { color: #0b1020; } }
  button:disabled { opacity: 0.5; cursor: default; }
  .examples { margin-top: 12px; font-size: 14px; color: var(--muted); }
  .examples a { color: var(--accent); cursor: pointer; text-decoration: none; margin-right: 12px; }
  section { margin-top: 24px; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); margin: 0 0 8px; }
  #answer { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px;
            min-height: 48px; white-space: pre-wrap; }
  #answer sup a { color: var(--accent); text-decoration: none; font-weight: 600; font-size: 12px; }
  #status { color: var(--muted); font-size: 14px; margin-top: 8px; }
  #status.warn { color: var(--warn); }
  ol { padding-left: 0; list-style: none; margin: 0; }
  li.source { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; margin-bottom: 8px; }
  li.source.cited { border-color: var(--accent); background: var(--accent-soft); }
  .src-head { font-weight: 600; font-size: 14px; }
  .src-text { color: var(--muted); font-size: 14px; margin-top: 4px; }
  .hidden { display: none; }
</style>
</head>
<body>
<main>
  <h1>TelecomDocQA</h1>
  <p class="sub">Ask about 5G. Answers come only from 3GPP specifications (TS 38.300, 23.501, 23.502, 33.501) and cite their sources.</p>

  <form id="ask-form">
    <textarea id="question" placeholder="e.g. What is the role of the AMF?" required minlength="3" maxlength="500"></textarea>
    <div class="row">
      <select id="topic" aria-label="Topic">
        <option value="">All topics</option>
        <option value="radio_access">Radio access (TS 38.300)</option>
        <option value="architecture">Architecture (TS 23.501)</option>
        <option value="procedures">Procedures (TS 23.502)</option>
        <option value="security">Security (TS 33.501)</option>
      </select>
      <input id="section" type="text" placeholder="Section, e.g. 6.2" aria-label="Section">
      <button id="ask-button" type="submit">Ask</button>
    </div>
    <div class="examples">Try:
      <a>What is the role of the AMF?</a>
      <a>How is the SUPI protected over the air?</a>
      <a>What is a bandwidth part?</a>
    </div>
  </form>

  <section id="answer-section" class="hidden">
    <h2>Answer</h2>
    <div id="answer"></div>
    <div id="status"></div>
  </section>

  <section id="sources-section" class="hidden">
    <h2>Sources</h2>
    <ol id="sources"></ol>
  </section>
</main>

<script>
  const form = document.getElementById("ask-form");
  const button = document.getElementById("ask-button");
  const answerBox = document.getElementById("answer");
  const statusBox = document.getElementById("status");
  const sourcesList = document.getElementById("sources");
  let stream = null;

  // Clicking an example fills in the question.
  document.querySelectorAll(".examples a").forEach(link => {
    link.addEventListener("click", () => { document.getElementById("question").value = link.textContent; });
  });

  function escapeHtml(text) {
    return text.replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
  }

  // Show **bold** text and turn [3] into a small link to source 3.
  function formatAnswer(text) {
    return escapeHtml(text)
      .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
      .replace(/\[(\d+)\]/g, '<sup><a href="#source-$1">[$1]</a></sup>');
  }

  // Shorten text without cutting a word in half.
  function preview(text, limit = 280) {
    if (text.length <= limit) return text;
    return text.slice(0, limit).replace(/\s+\S*$/, "") + " ...";
  }

  function showSources(sources) {
    sourcesList.innerHTML = "";
    sources.forEach((s, i) => {
      const pages = s.page_start === s.page_end ? `p. ${s.page_start}` : `pp. ${s.page_start}-${s.page_end}`;
      const item = document.createElement("li");
      item.className = "source";
      item.id = `source-${i + 1}`;
      item.innerHTML = `<div class="src-head">[${i + 1}] ${escapeHtml(s.spec)} §${escapeHtml(s.section_number)} ${escapeHtml(s.section_title)} (${pages})</div>` +
                       `<div class="src-text">${escapeHtml(preview(s.text))}</div>`;
      sourcesList.appendChild(item);
    });
    document.getElementById("sources-section").classList.toggle("hidden", sources.length === 0);
  }

  form.addEventListener("submit", event => {
    event.preventDefault();
    if (stream) stream.close();

    const params = new URLSearchParams({ question: document.getElementById("question").value });
    const topic = document.getElementById("topic").value;
    const section = document.getElementById("section").value.trim();
    if (topic) params.set("topic", topic);
    if (section) params.set("section", section);

    let answerText = "";
    answerBox.textContent = "";
    statusBox.textContent = "Searching the specifications...";
    statusBox.className = "";
    showSources([]);
    document.getElementById("answer-section").classList.remove("hidden");
    button.disabled = true;

    // Server-Sent Events: the server pushes "sources", then many "token"
    // events with pieces of the answer, then one "done" event.
    stream = new EventSource(`/ask/stream?${params}`);

    stream.addEventListener("sources", e => {
      showSources(JSON.parse(e.data));
      statusBox.textContent = "Writing the answer...";
    });
    stream.addEventListener("token", e => {
      answerText += JSON.parse(e.data);
      answerBox.textContent = answerText;  // plain text while it streams
    });
    stream.addEventListener("done", e => {
      const result = JSON.parse(e.data);
      answerBox.innerHTML = formatAnswer(result.answer);  // final, citations checked
      result.citations.forEach(c => document.getElementById(`source-${c.number}`)?.classList.add("cited"));
      statusBox.textContent = (result.cached ? "Answered instantly (cached)" : `Answered in ${result.total_seconds.toFixed(1)} s`) +
        (result.invalid_citations.length ? ` · warning: cited missing sources ${result.invalid_citations.join(", ")}` : "");
      if (result.invalid_citations.length) statusBox.className = "warn";
      finish();
    });
    stream.addEventListener("error", e => {
      // Either our own "error" event (with a message) or a lost connection.
      const message = e.data ? JSON.parse(e.data).detail : "Connection lost. Please try again.";
      statusBox.textContent = message;
      statusBox.className = "warn";
      finish();
    });
  });

  function finish() {
    if (stream) stream.close();
    stream = null;
    button.disabled = false;
  }
</script>
</body>
</html>
